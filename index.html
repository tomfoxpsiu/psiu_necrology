  :root {
    --gold: #8B6914;
    --gold-light: #C9A84C;
    --gold-bright: #E0C16F;

    --cream: #FAF8F3;
    --ink: #1C1A17;
    --muted: #6B6456;
    --rule: #D4C4A0;
    --card-bg: #FFFFFF;

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Lato', sans-serif;
    background-color: var(--cream);
    color: var(--ink);
    min-height: 100vh;
  }

  header {
    background-color: #1a1510;
    color: #F5EDD5;
    text-align: center;
    padding: 3.5rem 2rem 3rem;
    border-bottom: 3px solid var(--gold-light);
    position: relative;
    overflow: hidden;
  }

        near-black header, so HIGHER opacity makes the crest more visible and

        0.90 (bold). Currently 0.65.

        the crest to read more clearly without it becoming a solid red block.

  /* Lift the header text above the watermark */
  header > * {
    position: relative;
    z-index: 1;
  }

  header::after {
    content: '';
    display: block;
    width: 60px;
    height: 1px;
    background: var(--gold-light);
    margin: 1.5rem auto 0;
    opacity: 0.5;
  }

  .greek-letters {
    font-family: 'EB Garamond', serif;
    font-size: 1rem;
    letter-spacing: 0.35em;
    color: var(--gold-bright);
    text-transform: uppercase;
    margin-bottom: 1.2rem;
  }

  header h1 {
    font-family: 'EB Garamond', serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 400;
    letter-spacing: 0.04em;
    color: #F5EDD5;
    line-height: 1.15;
    margin-bottom: 1rem;
  }

  header p.subtitle {
    font-size: 0.9rem;
    letter-spacing: 0.12em;
    color: var(--gold-bright);
    text-transform: uppercase;
    font-weight: 400;
  }

  .epigraph {
    text-align: center;
    padding: 2.5rem 2rem;
    border-bottom: 1px solid var(--rule);
  }

  .epigraph blockquote {
    font-family: 'EB Garamond', serif;
    font-style: italic;

<body>

<header>
  <div class="greek-letters">Psi Upsilon Fraternity</div>

<div class="epigraph">

  </blockquote>

       href="https://give.psiu.org/give/557088#!/donation/checkout"
       target="_blank" rel="noopener">Make a Memorial Gift</a>
    <a class="return-button" href="https://psiu.org/">Return to psiu.org</a>
  </div>
</div>

<div class="controls">
  <div class="controls-left">
    <div class="search-box">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search" placeholder="Search by name…" aria-label="Search members">
    </div>
    <select class="filter-select" id="chapterFilter" aria-label="Filter by chapter">
      <option value="">All chapters</option>
    </select>
    <select class="filter-select" id="sortOrder" aria-label="Sort order">
      <option value="notification">Sort: Recently added</option>
      <option value="name">Sort: Name A–Z</option>
      <option value="year">Sort: Class year</option>
      <option value="deceased">Sort: Date deceased</option>
    </select>
  </div>

</div>

<div class="grid" id="grid" role="list">
  <div class="status-message">
    <div class="spinner"></div><br>Loading roster…
  </div>
</div>

<footer>
  &copy; Psi Upsilon Fraternity &nbsp;·&nbsp; In loving memory
</footer>

<script>
/*
  ╔══════════════════════════════════════════════════════════════════╗
  ║              CONFIGURATION — EDIT ONLY THIS SECTION             ║
  ║                                                                  ║
  ║  Paste your published Google Sheet CSV URL below.               ║
  ║                                                                  ║
  ║  HOW TO GET YOUR URL:                                           ║
  ║  1. Open your Google Sheet                                      ║
  ║  2. File → Share → Publish to web                               ║
  ║  3. Choose your sheet tab, select "Comma-separated values"      ║
  ║  4. Click Publish, copy the URL, paste it below                 ║
  ╚══════════════════════════════════════════════════════════════════╝
*/

const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS27pm05qlWhwdtYPPXILVsHqgxnqL3kzzwlWbEALRM5OzNpd1xfoTR__i8hZheBsNRjkpUfOd9ibDP/pub?output=csv";

/* ── NO EDITS NEEDED BELOW THIS LINE ── */

let allMembers = [];

// Convert a sheet date into a sortable number (milliseconds).
// Handles "8/8/2025" and "12/13/1959" (US M/D/YYYY, the format Google Sheets
// exports) as well as "2025-08-08" (ISO), in case the sheet format changes.
// Returns null for blanks or anything unrecognizable.
function parseDate(str) {
  const s = (str || '').trim();
  if (!s) return null;

  // ISO: YYYY-MM-DD
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return Date.UTC(+m[1], +m[2] - 1, +m[3]);

  // US: M/D/YYYY or M-D-YYYY (also accepts 2-digit years)
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if (m) {
    let month = +m[1], day = +m[2], year = +m[3];
    if (year < 100) year += year < 30 ? 2000 : 1900;
    // If the first number can't be a month but the second can, the sheet is
    // exporting day-first (a non-US spreadsheet locale). Swap rather than
    // letting JavaScript roll "month 13" over into the next year silently.
    if (month > 12 && day <= 12) { const t = month; month = day; day = t; }
    if (month < 1 || month > 12 || day < 1 || day > 31) return null;
    return Date.UTC(year, month - 1, day);
  }

  // Last resort: let the browser try (e.g. "January 4, 2024")
  const t = Date.parse(s);
  return isNaN(t) ? null : t;
}

// A URL pasted without a protocol ("www.legacy.com/...") would otherwise be
// treated as a path on this site and 404. Prepend https:// when it's missing.
function normalizeUrl(u) {
  const s = (u || '').trim();
  if (!s) return '';
  if (/^https?:\/\//i.test(s)) return s;
  if (s.startsWith('//')) return 'https:' + s;
  if (/^(mailto:|tel:)/i.test(s)) return s;
  return 'https://' + s;
}

// Escape sheet values before inserting them into HTML, so an ampersand, angle
// bracket, or stray quote in a cell can't break a card's markup.
function esc(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Build display name: full legal name + (Nickname) if present
// e.g. "Dr. James Robert Williams Jr. (Jim)"
function buildDisplayName(m) {
  // Title through last name join with normal spaces
  let name = [m.title, m.firstName, m.middleName, m.lastName]
    .map(p => (p || '').trim())
    .filter(Boolean)
    .join(' ');

  // Suffix: sheet values may be stored as ", Jr." / ", MD" / "III".
  // If the suffix already begins with a comma, attach it directly (no space
  // before the comma); otherwise separate it with a space.
  const suffix = (m.suffix || '').trim().replace(/\s+/g, ' ');
  if (suffix) {
    name += /^,/.test(suffix) ? suffix : ' ' + suffix;
  }

  if (m.nickname) name += ` (${m.nickname})`;
  return name;
}

// Initials from first + last name for placeholder
function initials(m) {
  const first = (m.firstName || m.lastName || '?')[0].toUpperCase();
  const last  = m.lastName ? m.lastName[0].toUpperCase() : '';
  return last ? first + last : first;
}

// Split CSV text into rows of fields. Scans the whole document character by
// character rather than splitting on newlines first, so a cell containing a
// line break (Alt+Enter in Google Sheets) doesn't split one member into two
// rows. Also handles "" as an escaped double quote and CRLF line endings.
function splitCSV(text) {
  const rows = [];
  let row = [], cur = '', inQuote = false;

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];

    if (inQuote) {
      if (ch === '"') {
        if (text[i + 1] === '"') { cur += '"'; i++; }  // escaped quote
        else inQuote = false;
      } else {
        cur += ch;
      }
      continue;
    }

    if (ch === '"')       { inQuote = true; }
    else if (ch === ',')  { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;   // CRLF
      row.push(cur); cur = '';
      rows.push(row); row = [];
    }
    else { cur += ch; }
  }

  row.push(cur);
  rows.push(row);

  // Drop trailing blank rows (Google pads the export with empty lines)
  return rows.filter(r => r.some(c => c.trim() !== ''));
}

function parseCSV(text) {
  const rows = splitCSV(text);
  if (rows.length < 2) return [];

  const headers = rows[0].map(h => h.toLowerCase().trim());

  function col(obj, ...keys) {
    for (const k of keys) {
      const val = obj[k.toLowerCase().trim()];
      if (val !== undefined && val !== '') return val;
    }
    return '';
  }

  return rows.slice(1).map(vals => {
    const obj = {};
    headers.forEach((h, i) => { obj[h] = (vals[i] || '').trim(); });

    return {
      title:               col(obj, 'title'),
      firstName:           col(obj, 'first name', 'firstname', 'first'),
      middleName:          col(obj, 'middle name', 'middlename', 'middle'),
      lastName:            col(obj, 'last name', 'lastname', 'last'),
      suffix:              col(obj, 'suffix'),
      nickname:            col(obj, 'nickname', 'nick'),
      membershipId:        col(obj, 'id', 'membershipid', 'membership id'),  // internal, not shown
      chapter:             col(obj, 'chapter'),
      classYear:           col(obj, 'class', 'classyear', 'class year'),
      birthDate:           col(obj, 'birth date', 'birthdate', 'dob'),
      deceased:            col(obj, 'date deceased', 'datedeceased', 'deceased'),
      obituaryUrl:         normalizeUrl(col(obj, 'obit summary-equals obit link', 'obituaryurl', 'obit link', 'obituary link')),
      photo:               normalizeUrl(col(obj, 'obituary photo link', 'photo', 'photourl', 'photo link')),
      note:                col(obj, 'note', 'notes', 'tribute'),
      notificationDate:    col(obj, 'deceased notification', 'deceasednotification', 'notification'),  // internal, drives sort
    };
  }).filter(m => m.firstName || m.lastName);
}

function buildCard(m) {
  const displayName = buildDisplayName(m);
  const hasPhoto    = m.photo !== '';
  const hasObit     = m.obituaryUrl !== '';
  const init        = initials(m);

  // The initials are stored in a data attribute; a post-render pass attaches the
  // error handler in JS (an inline onerror can't safely carry quoted markup).
  const photoHTML = hasPhoto
    ? `<div class="card-photo-wrapper">
         <img class="card-photo" src="${esc(m.photo)}" alt="Photo of ${esc(displayName)}"
              loading="lazy" data-initials="${esc(init)}">
       </div>`
    : `<div class="card-photo-placeholder"><div class="initials-circle">${esc(init)}</div></div>`;

  const rows = [];
  if (m.chapter)   rows.push(`<div class="card-meta-row"><span class="meta-label">Chapter</span><span class="meta-value">${esc(m.chapter)}</span></div>`);
  if (m.classYear) rows.push(`<div class="card-meta-row"><span class="meta-label">Class</span><span class="meta-value">${esc(m.classYear)}</span></div>`);
  if (m.birthDate) rows.push(`<div class="card-meta-row"><span class="meta-label">Born</span><span class="meta-value">${esc(m.birthDate)}</span></div>`);
  if (m.deceased)  rows.push(`<div class="card-meta-row"><span class="meta-label">Passed</span><span class="meta-value">${esc(m.deceased)}</span></div>`);

  const obitHTML = hasObit
    ? `<div class="divider"></div>
       <a class="obit-link" href="${esc(m.obituaryUrl)}" target="_blank" rel="noopener">
         <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
           <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
           <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
         </svg>
         Read obituary
       </a>` : '';

  const noteHTML = m.note
    ? `<p style="font-family:'EB Garamond',serif;font-style:italic;font-size:0.92rem;color:var(--muted);margin-top:0.6rem;line-height:1.55;">"${esc(m.note)}"</p>`
    : '';

  return `
    <article class="card" role="listitem">
      ${photoHTML}
      <div class="card-body">
        <h2 class="card-name">${esc(displayName)}</h2>
        ${m.chapter ? `<p class="card-chapter">${esc(m.chapter)}</p>` : ''}
        <div class="card-meta">${rows.join('')}</div>
        ${noteHTML}
        ${obitHTML}
      </div>
    </article>`;
}

// If an obituary photo fails to load (dead link, host blocks hotlinking, or the
// image has been removed), swap in the gold initials circle instead of leaving
// an empty box.
function attachPhotoFallbacks(container) {
  container.querySelectorAll('img.card-photo').forEach(img => {
    const swap = () => {
      const circle = document.createElement('div');
      circle.className = 'initials-circle';
      circle.textContent = img.dataset.initials || '';
      if (img.parentElement) img.parentElement.replaceChildren(circle);
    };
    img.addEventListener('error', swap);
    // Cached failures can fire before the listener is attached
    if (img.complete && img.naturalWidth === 0) swap();
  });
}

function populate() {
  const search  = document.getElementById('search').value.toLowerCase().trim();
  const chapter = document.getElementById('chapterFilter').value;
  const sort    = document.getElementById('sortOrder').value;

  let filtered = allMembers.filter(m => {
    const fullName     = buildDisplayName(m).toLowerCase();
    const matchSearch  = !search || fullName.includes(search) || (m.chapter||'').toLowerCase().includes(search);
    const matchChapter = !chapter || m.chapter === chapter;
    return matchSearch && matchChapter;
  });

  // Sort dates newest-first. Rows with a missing or unparseable date go last,
  // regardless of sort direction, so blanks never float to the top.
  function byDateDesc(a, b, field) {
    const da = parseDate(a[field]);
    const db = parseDate(b[field]);
    if (da === null && db === null) return 0;
    if (da === null) return 1;
    if (db === null) return -1;
    return db - da;
  }

  filtered.sort((a, b) => {
    if (sort === 'name') {
      return (a.lastName||'').localeCompare(b.lastName||'') ||
             (a.firstName||'').localeCompare(b.firstName||'');
    }
    if (sort === 'year') {
      // Numeric compare so "1945" sorts before "1981"; blanks go last
      const ya = parseInt(a.classYear, 10);
      const yb = parseInt(b.classYear, 10);
      if (isNaN(ya) && isNaN(yb)) return 0;
      if (isNaN(ya)) return 1;
      if (isNaN(yb)) return -1;
      return ya - yb;
    }
    if (sort === 'deceased')     return byDateDesc(a, b, 'deceased');
    if (sort === 'notification') return byDateDesc(a, b, 'notificationDate');
    return 0;
  });

  const grid  = document.getElementById('grid');
  const label = document.getElementById('countLabel');

  if (filtered.length === 0) {
    grid.innerHTML = '<p class="empty-state">No members found matching your search.</p>';
    label.textContent = '';
    return;
  }

  grid.innerHTML = filtered.map(buildCard).join('');
  label.textContent = `${filtered.length} member${filtered.length !== 1 ? 's' : ''}`;
  attachPhotoFallbacks(grid);
}

function buildFilters() {
  const chapters = [...new Set(allMembers.map(m => m.chapter).filter(Boolean))].sort();
  const sel = document.getElementById('chapterFilter');
  chapters.forEach(ch => {
    const opt = document.createElement('option');
    opt.value = ch; opt.textContent = ch;
    sel.appendChild(opt);
  });
}

async function loadData() {
  const grid = document.getElementById('grid');

  if (!SHEET_CSV_URL || SHEET_CSV_URL.includes('PASTE_YOUR')) {
    grid.innerHTML = `<div class="status-message error">
      ⚠️ No Google Sheet connected yet.<br><br>
      <span style="font-size:0.95rem;">Open this HTML file, find the <strong>SHEET_CSV_URL</strong> variable near the top of the script, and paste your published CSV URL there.</span>
    </div>`;
    return;
  }

  // Try direct fetch first; if blocked (e.g. local file), fall back to CORS proxy
  async function fetchCSV(url) {
    try {
      const res = await fetch(url);
      if (res.ok) return res;
    } catch(e) { /* fall through to proxy */ }
    const proxy = 'https://corsproxy.io/?' + encodeURIComponent(url);
    const res = await fetch(proxy);
    if (res.ok) return res;
    throw new Error('Could not reach the Google Sheet. Check that it is published as CSV.');
  }

  try {
    const res = await fetchCSV(SHEET_CSV_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status} — check that the sheet is published as CSV.`);
    const text = await res.text();
    allMembers = parseCSV(text);

    if (allMembers.length === 0) {
      throw new Error('No data rows found. Check that your column headers match the expected names.');
    }

    buildFilters();

    // Debounced: rebuilding several hundred cards on every keystroke is slow
    // on phones, so wait until typing pauses.
    let searchTimer = null;
    document.getElementById('search').addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(populate, 180);
    });
    document.getElementById('chapterFilter').addEventListener('change', populate);
    document.getElementById('sortOrder').addEventListener('change', populate);

    populate();
  } catch (err) {
    grid.innerHTML = `<div class="status-message error">
      ⚠️ Could not load roster data.<br><br>
      <span style="font-size:0.95rem;">${err.message}</span>
    </div>`;
    console.error('Sheet load error:', err);
  }
}

document.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
